<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>CALBOK — Calls fade. Receipts stay.</title><rect width="1200" height="630" fill="#142c25"/><path d="M850 0H1200V630H610Z" fill="#244a35"/><g transform="translate(52 39) scale(1.3)"><path d="M36 12H18a8 8 0 0 0-8 8v16l5-3 5 3 5-3 5 3 6-4v-4H21a4 4 0 0 1-4-4v-3a3 3 0 0 1 3-3h16V12Z" fill="#f4f2e9"/><path d="m32 20 5 4-5 4" fill="none" stroke="#ef7145" stroke-width="3"/></g><text x="117" y="83" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="-1" fill="#f4f2e9">CALBOK<tspan fill="#ef7145">.</tspan></text><text x="65" y="191" font-family="monospace" font-size="13" letter-spacing="3" fill="#d5e6bf">LESS NOISE. MORE RECEIPTS.</text><text x="60" y="309" font-family="Arial,sans-serif" font-size="103" font-weight="700" letter-spacing="-6" fill="#f4f2e9">Calls fade.</text><text x="60" y="419" font-family="Arial,sans-serif" font-size="103" font-weight="700" letter-spacing="-6" fill="#d5e6bf">Receipts stay.</text><text x="65" y="551" font-family="monospace" font-size="15" fill="#c1cebb">LOCK THE CALL. VERIFY THE OUTCOME. REMEMBER THE LESSON.</text><g transform="translate(888 186) rotate(9)"><path d="M0 0H208V260L195 251 182 260 169 251 156 260 143 251 130 260 117 251 104 260 91 251 78 260 65 251 52 260 39 251 26 260 13 251 0 260Z" fill="#f6f0dd"/><text x="20" y="40" font-family="monospace" font-size="12" fill="#244632">THE CALL RECORD</text><path d="M20 60H188M20 194H188" stroke="#9cab8a" stroke-dasharray="4 5"/><text x="20" y="104" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#244632">Put it</text><text x="20" y="138" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#244632">on record.</text><text x="20" y="175" font-family="monospace" font-size="9" fill="#637456">EVIDENCE DECIDES.</text><text x="20" y="224" font-family="monospace" font-size="9" fill="#637456">NO HINDSIGHT EDITS.</text></g><circle cx="1070" cy="464" r="52" fill="#ef7145"/><text x="1070" y="462" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142c25">ON</text><text x="1070" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#142c25">RECORD</text></svg>
